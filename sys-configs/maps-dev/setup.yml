# Setup steps for the maps-dev server, in Ansible playbook format.
# Ansible is not installed or run; these steps are applied manually.
# (Ubuntu 22.04)

- name: Set up maps-dev
  hosts: maps-dev
  become: true

  tasks:

  - name: install software-properties-common
    apt:
      name: software-properties-common
      state: present
      update_cache: yes

  - name: Install packages
    apt:
      name:
        - unattended-upgrades
        - curl
        - plocate
        - git
        - nginx
        - postfix
        - mailutils
      state: present
      update_cache: true

  - name: Remove old NodeJS 16.x repo
    apt_repository:
      repo: deb https://deb.nodesource.com/node_16.x jammy main
      state: absent
      filename: nodesource.list

  - name: Create apt keyrings directory
    file:
      path: /etc/apt/keyrings
      state: directory
      mode: '0755'

  - name: Add NodeSource repo key
    get_url:
      url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
      dest: /etc/apt/keyrings/nodesource.asc
      mode: '0644'

  - name: Add repo for NodeJS 24.x
    apt_repository:
      repo: deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_24.x nodistro main
      state: present
      filename: nodesource
      update_cache: yes

  # NodeSource's nodejs package includes npm
  - name: Install NodeJS
    apt:
      name: nodejs
      state: latest
      update_cache: yes

  - name: Copy nginx main config
    copy:
      src: configs/nginx/nginx.conf
      dest: /etc/nginx/nginx.conf

  - name: Copy nginx site config
    copy:
      src: configs/nginx/sites/maps-dev.conf
      dest: /etc/nginx/sites-available/maps-dev.conf

  - name: Enable nginx site config
    file:
      src: /etc/nginx/sites-available/maps-dev.conf
      dest: /etc/nginx/sites-enabled/maps-dev.conf
      state: link
    notify: restart_nginx

  - name: Start and Enable nginx
    systemd:
      name: nginx
      state: started
      enabled: true

  - name: Install pm2
    npm:
      name: pm2
      global: yes

  handlers:

    - name: restart_nginx
      systemd:
        name: nginx
        state: restarted